<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760">
  <rect width="1080" height="760" fill="#0f172a"/>
  <rect x="30" y="30" width="1020" height="700" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="60" y="78" fill="#93c5fd" font-family="Menlo, Monaco, Consolas, monospace" font-size="26">Dependency Injection Demo</text>
  <text x="60" y="118" fill="#94a3b8" font-family="Menlo, Monaco, Consolas, monospace" font-size="20">Constructor injection in Spring</text>

  <text x="60" y="170" fill="#f8fafc" font-family="Menlo, Monaco, Consolas, monospace" font-size="22">interface MessageService {</text>
  <text x="90" y="205" fill="#f8fafc" font-family="Menlo, Monaco, Consolas, monospace" font-size="22">String sendMessage();</text>
  <text x="60" y="240" fill="#f8fafc" font-family="Menlo, Monaco, Consolas, monospace" font-size="22">}</text>

  <text x="60" y="295" fill="#f472b6" font-family="Menlo, Monaco, Consolas, monospace" font-size="22">@Component</text>
  <text x="60" y="330" fill="#f8fafc" font-family="Menlo, Monaco, Consolas, monospace" font-size="22">class EmailService implements MessageService {</text>
  <text x="90" y="365" fill="#f8fafc" font-family="Menlo, Monaco, Consolas, monospace" font-size="22">public String sendMessage() {</text>
  <text x="120" y="400" fill="#86efac" font-family="Menlo, Monaco, Consolas, monospace" font-size="22">return "Email sent";</text>
  <text x="90" y="435" fill="#f8fafc" font-family="Menlo, Monaco, Consolas, monospace" font-size="22">}</text>
  <text x="60" y="470" fill="#f8fafc" font-family="Menlo, Monaco, Consolas, monospace" font-size="22">}</text>

  <text x="60" y="525" fill="#f472b6" font-family="Menlo, Monaco, Consolas, monospace" font-size="22">@Component</text>
  <text x="60" y="560" fill="#f8fafc" font-family="Menlo, Monaco, Consolas, monospace" font-size="22">class NotificationService {</text>
  <text x="90" y="595" fill="#f8fafc" font-family="Menlo, Monaco, Consolas, monospace" font-size="22">private final MessageService messageService;</text>
  <text x="90" y="630" fill="#f8fafc" font-family="Menlo, Monaco, Consolas, monospace" font-size="22">public NotificationService(MessageService messageService) {</text>
  <text x="120" y="665" fill="#f8fafc" font-family="Menlo, Monaco, Consolas, monospace" font-size="22">this.messageService = messageService;</text>
  <text x="90" y="700" fill="#f8fafc" font-family="Menlo, Monaco, Consolas, monospace" font-size="22">}</text>
  <text x="60" y="735" fill="#f8fafc" font-family="Menlo, Monaco, Consolas, monospace" font-size="22">}</text>
</svg>
